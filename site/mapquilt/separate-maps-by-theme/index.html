      <h1>캠핑 지도, 맛집 지도를 따로 만들 수 있을까요?</h1>
      <p>캠핑장, 여행지, 맛집처럼 주제를 하나 정해서 지도를 따로 만들 수 있어요. 조각지도에서는 지도를 여러 개 만들 수 있고, 모든 지도가 같은 167개 지역을 써요.</p>
      <p>새 지도 이름을 정할 때는 캠핑, 카페, 등산 같은 예시 이름을 눌러 고를 수 있어요. 이름은 20자까지 쓸 수 있고 이모지도 넣을 수 있어요.</p>
