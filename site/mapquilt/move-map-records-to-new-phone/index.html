      <h1>로그인 없는 앱, 폰 바꾸면 기록은 어떻게 옮기나요?</h1>
      <p>로그인이 없는 앱은 기록이 기기에만 남아서 폰을 바꿀 때 따로 옮겨야 해요. 조각지도에서는 [설정]의 [백업 내보내기]로 모든 지도와 사진을 파일 하나에 담아 파일 앱이나 클라우드 저장소에 둘 수 있어요.</p>
      <p>새 폰에서 [백업 가져오기]로 그 파일을 고르면 지도가 통째로 돌아와요. 가져오면 지금 있는 지도는 백업 내용으로 바뀌고 합쳐지지 않아요.</p>
