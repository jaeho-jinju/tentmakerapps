      <h1>여행 간 곳을 지도에 사진으로 남기려면?</h1>
      <p>다녀온 곳을 지도에 사진으로 남기고 싶을 때가 있어요. 조각지도에서는 지역을 누르고 [사진 고르기]로 사진 한 장을 고르면, 세 번 눌러 그 지역이 지역 모양대로 사진으로 채워져요.</p>
      <p>여행지에서 바로 남기고 싶다면 지역 시트의 [사진 찍기]로 그 자리에서 찍어 채울 수도 있어요. 찍은 사진은 사진첩에도 찍은 그대로 저장돼요.</p>
