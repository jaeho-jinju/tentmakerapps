      <h1>우리 동네 어린이집 행정처분, 어떻게 찾아보나요?</h1>
      <p>동네 어린이집 중 행정처분이 공표된 곳이 있는지 궁금할 때가 있어요. 어린이집 정보공개에서는 시·도를 고른 뒤 시·군·구를 골라 지역을 좁혀요. 고른 지역은 위반시설·위반행위자 두 탭에 함께 쓰여요.</p>
      <p>어린이집명이나 지역 이름으로 검색할 수도 있어요. 사람 이름으로 찾는 검색은 없어요.</p>
