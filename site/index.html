<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TheTentmaker 앱</title>
    <meta name="description" content="TheTentmaker가 만든 앱을 모아 둔 곳입니다." />
    <link rel="canonical" href="https://tentmakerapps.com/" />
    <style>
      :root {
        --navy: #12304a;
        --muted: #55667a;
        --sky: #e3eff7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        color: var(--navy);
        background: #fff;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 48px 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0 0 32px;
        color: var(--muted);
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li + li {
        margin-top: 12px;
      }
      a.app {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 16px;
        border-radius: 16px;
        background: var(--sky);
        color: inherit;
        text-decoration: none;
      }
      a.app img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
      }
      a.app strong {
        display: block;
        font-size: 18px;
      }
      a.app span {
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TheTentmaker 앱</h1>
      <p>TheTentmaker가 만든 앱을 모아 둔 곳입니다.</p>
      <ul>
        <li>
          <a class="app" href="/mapquilt/">
            <img src="/mapquilt/img/icon.webp" alt="" />
            <div>
              <strong>조각지도</strong>
              <span>사진으로 채우는 전국 지도</span>
            </div>
          </a>
        </li>
        <li>
          <a class="app" href="/right-to-know/">
            <img src="/right-to-know/img/icon.webp" alt="" />
            <div>
              <strong>어린이집 정보공개</strong>
              <span>법 위반 시설·보육교직원 공표</span>
            </div>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
