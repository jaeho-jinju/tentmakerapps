# 조각지도 사실 목록
#
# 매일 쓰는 글은 이 파일에 있는 사실만 쓴다. 글에 쓴 사실은 id로 밝히고, 검사 스크립트가 이 파일과 대조한다.
# 기능이나 스토어 상태가 바뀌면 이 파일부터 고친다.
#
# source 적는 법
#   mapquilt:<경로>   jaeho-jinju/mapquilt 저장소의 파일
#   mapquilt#<번호>   그 저장소의 이슈(#18은 기획서)
#   tentmakerapps:<경로>  이 저장소의 파일

checked: "2026-11-09"

app:
  name: 조각지도
  tagline: 사진으로 채우는 전국 지도
  developer: TheTentmaker
  page: https://tentmakerapps.com/mapquilt/
  app_store: https://apps.apple.com/kr/app/id6826815134
  google_play: null # 비공개 테스트 중. 프로덕션에 나오면 주소를 넣는다.
  privacy: https://sites.google.com/view/mapquilt

facts:
  - id: free-ads
    fact: 무료 앱이고 인앱 구매가 없다. 광고가 있다(앱을 켤 때 나오는 광고, 지도 화면 아래 배너, 지도 목록 속 광고 한 칸). 전면광고는 없다.
    source:
      - mapquilt:docs/store-listing.md §2.3 기록·광고·개인정보, §4 가격
      - mapquilt#18 범위 밖(전면광고)

  - id: stores
    fact: iPhone과 안드로이드 앱이다. App Store에는 나와 있고, Google Play는 비공개 테스트 중이라 아직 누구나 받을 수는 없다.
    source:
      - App Store 조회 API(2026-11-09, 버전 26.45.0)
      - tentmakerapps:docs/mapquilt.md 정한 것 4

  - id: korea-only
    fact: 한국어 앱이고 대한민국에서만 배포한다. 지도는 한국만 다룬다.
    source:
      - mapquilt:docs/store-listing.md §2 기본 언어, §4 배포 국가
      - mapquilt#18 범위 밖(해외 지도)

  - id: theme-maps
    fact: 캠핑장·여행지·맛집처럼 주제를 하나 정해 지도를 만든다. 지도는 여러 개 만들 수 있고, 모든 지도가 같은 167개 지역을 쓴다.
    source:
      - mapquilt:docs/store-listing.md §2.3 주제마다 지도 한 장
      - mapquilt:GLOSSARY.md 퀼트

  - id: map-name
    fact: 새 지도 이름 창에서 예시 이름 7개(캠핑·여행지·박물관·맛집·등산·카페·현충시설)를 눌러 고를 수 있다. 이름은 20자까지이고 이모지도 쓸 수 있다.
    source:
      - mapquilt:src/core/ui/QuiltNameDialog.tsx EXAMPLE_NAMES
      - mapquilt:src/core/quilt-store/store.ts QUILT_NAME_MAX_LENGTH
      - mapquilt#18 이야기 4·5

  - id: map-list
    fact: 지도 목록에서 지도마다 작은 지도와 진행률을 본다.
    source:
      - mapquilt:docs/store-listing.md §2.3 주제마다 지도 한 장
      - mapquilt#18 이야기 6

  - id: regions-167
    fact: 지역은 시·군 단위로 전국 167개다.
    source:
      - mapquilt:src/core/regions/index.ts 전체 지역 167개
      - mapquilt:src/core/regions/table.ts
      - mapquilt#18 3절

  - id: region-rules
    fact: 서울과 광역시의 자치구는 묶어 한 지역으로 센다(서울은 1곳). 세종도 한 지역이다. 광역시 소속 군 6개(기장·달성·군위·강화·옹진·울주)와 제주시·서귀포시는 각각 한 지역이다. 일반구가 있는 시(수원·성남 등 13곳)는 시 하나가 한 지역이다.
    source:
      - mapquilt#18 3절
      - mapquilt:docs/store-listing.md §2.3

  - id: sido-counts
    fact: 시·도 묶음은 16개이고, 묶음마다 지역 수는 서울 1·부산 2·대구 3·인천 3·대전 1·울산 2·세종 1·제주 2·경기 31·강원 18·충북 11·충남 15·전북 14·전남광주 23·경북 22·경남 18이다. 전남광주는 2026-07-01 출범한 전남광주통합특별시로, 옛 광주 1곳과 시·군 22곳이다.
    source:
      - mapquilt:src/core/regions/table.ts sido
      - mapquilt#18 3절 표

  - id: islands-dokdo
    fact: 섬은 소속 시·군에 들어간다. 독도는 울릉군에 들어가서, 울릉군을 채우면 독도에도 같은 사진이 들어간다. 독도는 지도에 늘 보이고 "독도"라고 적힌다.
    source:
      - mapquilt:GLOSSARY.md 지역
      - mapquilt#18 3절, 이야기 15·37

  - id: fill-3-taps
    fact: 지역을 누르고 [사진 고르기]로 사진 한 장을 고르면, 세 번 눌러 그 지역이 지역 모양대로 사진으로 채워진다.
    source:
      - mapquilt:docs/store-listing.md §2.3 세 번 눌러 한 지역 채우기
      - mapquilt#18 해결

  - id: take-photo
    fact: 지역 시트의 [사진 찍기]로 그 자리에서 찍어 채울 수도 있다. 찍은 사진은 사진첩에도 찍은 그대로 저장된다. 카메라 권한은 [사진 찍기]를 처음 누를 때 묻는다.
    source:
      - mapquilt:docs/store-listing.md §2.3, §3.2 권한
      - mapquilt#18 이야기 87·91·93

  - id: auto-fit
    fact: 사진은 그 지역에서 가장 큰 땅에 자동으로 맞춰진다. 원하면 [위치 조정]으로 옮기고 크기를 바꾼다.
    source:
      - mapquilt:docs/store-listing.md §2.3
      - mapquilt#18 이야기 23·24

  - id: photo-privacy
    fact: 사진첩 접근 권한 없이, 시스템 사진 선택기에서 고른 사진만 앱에 들어온다. 사진첩에서 원본을 지워도 지도의 사진은 남는다.
    source:
      - mapquilt:docs/store-listing.md §2.3, §3.2 사진 및 동영상 권한
      - mapquilt#18 이야기 20·22

  - id: multi-photo
    fact: "[사진 더하기]로 한 지역에 사진을 여러 장 넣는다. 지도에는 대표 사진 한 장이 보인다. [크게 보기]에서 사진을 넘겨 보고, [대표로 하기]로 대표 사진을 바꾸고, 사진 한 장만 지울 수도 있다."
    source:
      - mapquilt:docs/store-listing.md §2.3 한 지역에 사진 여러 장
      - mapquilt:GLOSSARY.md 대표 사진
      - mapquilt#18 이야기 26·27·95·96

  - id: memo
    fact: 채운 지역마다 메모를 하나 남기고 고치고 지울 수 있다. 지역 시트의 사진 아래에 메모 첫 줄이 보이고, 누르면 전체를 본다. 26.45.0(2026-11-08)부터 들어갔다.
    source:
      - mapquilt:GLOSSARY.md 메모
      - mapquilt#18 이야기 98·99
      - mapquilt#90 댓글 issuecomment-6719589489(새로운 기능 문안 "지역마다 메모를 남길 수 있습니다")

  - id: progress
    fact: 지도 위에 "23 / 167"처럼 채운 지역 수가 늘 보인다. 진행률을 누르면 시·도별 진행률과 채운 지역·빈 지역 목록을 보고, 목록에서 지역 이름을 누르면 지도에서 그 지역을 바로 연다.
    source:
      - mapquilt:docs/store-listing.md §2.3 진행률
      - mapquilt#18 이야기 29~32

  - id: complete
    fact: 빈 지역이 하나도 남지 않으면 그 지도는 완성이다.
    source:
      - mapquilt:GLOSSARY.md 완성된 퀼트
      - mapquilt:docs/store-listing.md §2.3 진행률

  - id: zoom-8x
    fact: 지도를 두 손가락으로 8배까지 확대해 작은 지역도 누르고 사진도 자세히 본다.
    source:
      - mapquilt:src/core/map-drawing/QuiltMapCanvas.tsx MAX_ZOOM
      - mapquilt:docs/store-listing.md §2.3 진행률

  - id: share-image
    fact: 지도 이름과 진행률, 채운 지도를 담은 세로 9:16(1080×1920) 이미지 한 장을 만든다. [사진첩에 저장]하거나 [공유하기]로 메신저·SNS에 보낸다. 조각이 하나도 없어도 만들 수 있고, 다 채우면 "167 / 167 지역 · 완성"이 적힌다.
    source:
      - mapquilt:docs/store-listing.md §2.3 공유 이미지
      - mapquilt:src/features/share-image/renderShareImage.ts WIDTH·HEIGHT
      - mapquilt:src/features/share-image/shareText.ts
      - mapquilt#18 이야기 45·48

  - id: backup
    fact: "[설정]의 [백업 내보내기]로 모든 지도와 사진을 파일 하나에 담아 파일 앱, 클라우드 저장소 등 원하는 곳에 둔다. 폰을 바꾸면 [백업 가져오기]로 그 파일을 골라 지도를 통째로 되살린다. 가져오면 지금 있는 지도는 백업 내용으로 바뀐다(합치지 않는다)."
    source:
      - mapquilt:docs/store-listing.md §2.3 백업
      - mapquilt#18 이야기 54·59·60, 범위 밖(합치기)

  - id: no-login
    fact: 회원가입이나 로그인이 없다. 지도와 사진은 이 기기에만 저장되고, 직접 공유하거나 백업으로 내보내지 않는 한 기기 밖으로 나가지 않는다.
    source:
      - mapquilt:docs/store-listing.md §2.3 기록·광고·개인정보
      - mapquilt#18 이야기 71·72

  - id: data-collected
    fact: 앱 이용 통계·오류 보고·광고를 위해 Google 서비스(Firebase·AdMob)가 정보를 수집한다. 지도 이름·지역·사진 같은 내용은 보내지 않는다. 자세한 내용은 개인정보처리방침에 있다.
    source:
      - mapquilt:docs/store-listing.md §2.3, §3.1 기타 사용자 생성 콘텐츠 행, §5.5 ADS AND DATA

  - id: dark-mode
    fact: 다크 모드를 지원한다. 시트와 제목줄이 어두워지고, 지도 그림은 밝은 그대로다.
    source:
      - mapquilt:docs/store-listing.md §6 스크린샷 08과 그 아래 설명
      - tentmakerapps:site/mapquilt/index.html 그 밖에도(다크 모드)

  - id: map-data
    fact: 지도 경계는 통계청 SGIS 자료를 vuski/admdongkor(CC BY 4.0, 2026-07-01 기준)가 가공한 것이다. 앱의 [설정]과 공유 이미지에 출처를 적는다.
    source:
      - mapquilt#18 4절
      - mapquilt:src/core/regions/index.ts short
      - mapquilt:docs/store-listing.md §5.4

# 글에서 쓰지 않는 것. 스토어 문안 원칙을 글에도 그대로 쓴다.
avoid:
  - id: no-photo-limit
    rule: 한 지역의 사진 수 상한(10장)은 쓰지 않는다. 한정 짓는 말로 읽힌다.
    source:
      - mapquilt:docs/store-listing.md 원칙
      - mapquilt#88

  - id: no-memo-limit
    rule: 메모 글자 수 상한(200자)도 같은 이유로 쓰지 않는다.
    source:
      - no-photo-limit과 같은 이유(2026-11-09 초안에서 넓힘)

  - id: no-trademarks
    rule: 남의 상표와 앱 이름을 쓰지 않는다. 공유할 곳은 '메신저·SNS'라고만 쓴다.
    source:
      - mapquilt:docs/store-listing.md 원칙

  - id: no-hype
    rule: 앱을 치켜세우는 말("최고", "가장 쉬운")과 순위·가격 문구를 쓰지 않는다.
    source:
      - mapquilt:docs/store-listing.md 원칙

  - id: screen-words
    rule: 앱 안의 지도 한 장은 "지도"라고 쓰고 "퀼트"라고 쓰지 않는다. 버튼은 화면 글자 그대로 [사진 고르기]처럼 쓴다.
    source:
      - mapquilt:docs/store-listing.md 원칙
      - mapquilt:GLOSSARY.md 퀼트
